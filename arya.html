<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine 💖</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
width:100vw;
overflow:hidden;
font-family:sans-serif;
background:linear-gradient(135deg,#ff9a9e,#fad0c4);
display:flex;
justify-content:center;
align-items:center;
position:relative;
}

/* 🌸 FLOWER EFFECT */
.flower{
position:fixed;
top:-40px;
font-size:22px;
animation:fall linear infinite;
z-index:1;
}
@keyframes fall{
0%{transform:translateY(0) rotate(0deg);}
100%{transform:translateY(110vh) rotate(360deg);}
}

/* BACKGROUND VIDEO */
#bgVideo{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
display:none;
}

/* FIREWORK CANVAS */
#fireCanvas{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
z-index:4;
}

/* FIRST SCREEN */
.container{
text-align:center;
z-index:2;
}

button{
padding:12px 28px;
font-size:18px;
border:none;
border-radius:30px;
cursor:pointer;
margin:10px;
}

#yes{
background:#ff2e63;
color:white;
}

#no{
background:white;
color:#ff2e63;
position:absolute;
}

/* VALENTINE IMAGE */
#valentineImage{
position:absolute;
top:35%;
left:50%;
transform:translate(-50%,-50%) scale(0);
width:80%;
max-width:350px;
border-radius:15px;
opacity:0.7;
transition:0.8s;
z-index:2;
}

/* GIFT SECTION */
.gifts{
position:absolute;
bottom:120px;
display:none;
gap:20px;
z-index:3;
}

.gift{
width:65px;
height:65px;
background:#ff2e63;
border-radius:12px;
cursor:pointer;
position:relative;
}

.gift:before{
content:"";
position:absolute;
width:100%;
height:15px;
background:gold;
top:25px;
}

.gift:after{
content:"";
position:absolute;
width:15px;
height:100%;
background:gold;
left:25px;
}

.open-box{
position:absolute;
bottom:40px;
padding:12px 28px;
border-radius:30px;
cursor:pointer;
display:none;
z-index:3;
font-weight:bold;
color:white;
background:linear-gradient(45deg,#ff0000,#ff7300,#ff0000);
animation: fireGlow 0.5s infinite alternate;
box-shadow:
0 0 10px #ff0000,
0 0 20px #ff7300,
0 0 30px #ff0000;
}

@keyframes fireGlow{
from{
box-shadow:
0 0 10px #ff0000,
0 0 20px #ff7300,
0 0 30px #ff0000;
transform:scale(1);
}
to{
box-shadow:
0 0 20px #ff0000,
0 0 40px #ff7300,
0 0 60px #ff0000;
transform:scale(1.05);
}
}


#loveMessage{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%) scale(0);
font-size:34px;
font-weight:bold;
color:#ff0000;
z-index:6;
transition:0.5s;
text-align:center;
animation: glowRed 1s infinite alternate;
text-shadow:
0 0 10px #ff0000,
0 0 20px #ff1a1a,
0 0 40px #ff3333,
0 0 60px #ff0000;
}

@keyframes glowRed{
from{
text-shadow:
0 0 10px #ff0000,
0 0 20px #ff1a1a,
0 0 40px #ff3333;
}
to{
text-shadow:
0 0 20px #ff0000,
0 0 40px #ff1a1a,
0 0 80px #ff3333;
}
}


/* VIDEO GIFT CONTAINER */
#giftVideoContainer{
position:fixed;
bottom:0;
left:0;
width:100%;
height:50%;
background:black;
display:none;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:10;
}

#giftVideo{
width:100%;
height:100%;
object-fit:contain;
}

#closeBtn{
position:absolute;
top:10px;
right:10px;
background:red;
color:white;
border:none;
padding:6px 12px;
border-radius:20px;
cursor:pointer;
z-index:11;
}
</style>
</head>

<body>

<canvas id="fireCanvas"></canvas>

<video id="bgVideo" loop muted playsinline>
<source src="video.mp4" type="video/mp4">
</video>

<div class="container" id="firstScreen">
<h1 style="color:white;">Will You Be My Valentine? 💖</h1>
<button id="yes">YES 💖</button>
<button id="no">NO 😜</button>
</div>

<img src="super4.png" id="valentineImage">

<div class="gifts" id="giftSection">
<div class="gift" onclick="openGift('supriya.mp4')"></div>
<div class="gift" onclick="openGift('giftvideo2.mp4')"></div>
<div class="gift" onclick="showLove()"></div>
</div>

<div class="open-box" id="openBox" onclick="goToMemories()">OPEN ME 💌</div>

<div id="giftVideoContainer">
<button id="closeBtn" onclick="closeGift()">Close ✖</button>
<video id="giftVideo" controls autoplay playsinline></video>
</div>

<div id="loveMessage">I LOVE YOU SUPRIYA 💖</div>

<script>
const yesBtn=document.getElementById("yes");
const noBtn=document.getElementById("no");
const container=document.getElementById("firstScreen");
const video=document.getElementById("bgVideo");
const image=document.getElementById("valentineImage");
const giftSection=document.getElementById("giftSection");
const openBox=document.getElementById("openBox");
const loveMessage=document.getElementById("loveMessage");
const giftVideoContainer=document.getElementById("giftVideoContainer");
const giftVideo=document.getElementById("giftVideo");

/* FLOWER RAIN */
setInterval(()=>{
const f=document.createElement("div");
f.className="flower";
f.innerHTML="🌸";
f.style.left=Math.random()*window.innerWidth+"px";
f.style.animationDuration=(Math.random()*3+2)+"s";
document.body.appendChild(f);
setTimeout(()=>f.remove(),5000);
},400);

/* NO BUTTON MOVE */
noBtn.addEventListener("mouseover",()=>{
noBtn.style.left=Math.random()*200+"px";
noBtn.style.top=Math.random()*150+"px";
});

/* YES CLICK */
yesBtn.addEventListener("click",()=>{
container.style.display="none";

video.style.display="block";
video.play();

image.style.transform="translate(-50%,-50%) scale(1)";

giftSection.style.display="flex";
openBox.style.display="block";

startFireworks();
});

/* LOVE POPUP */
function showLove(){
loveMessage.style.transform="translate(-50%,-50%) scale(1)";
setTimeout(()=>{
loveMessage.style.transform="translate(-50%,-50%) scale(0)";
},3000);
}

/* VIDEO GIFT */
function openGift(src){
giftVideoContainer.style.display="flex";
giftVideo.src=src;
giftVideo.play();
}

function closeGift(){
giftVideo.pause();
giftVideo.currentTime=0;
giftVideoContainer.style.display="none";
}

/* REDIRECT */
function goToMemories(){
window.location.href="memories.html";
}

/* FIREWORKS */
const canvas=document.getElementById("fireCanvas");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];

function startFireworks(){
for(let i=0;i<80;i++){
particles.push({
x:canvas.width/2,
y:canvas.height/3,
angle:Math.random()*Math.PI*2,
speed:Math.random()*5+2,
life:100,
color:"hsl("+Math.random()*360+",100%,60%)"
});
}
}

function animate(){
ctx.clearRect(0,0,canvas.width,canvas.height);
particles.forEach((p,i)=>{
p.x+=Math.cos(p.angle)*p.speed;
p.y+=Math.sin(p.angle)*p.speed;
p.life-=2;
ctx.globalAlpha=p.life/100;
ctx.fillStyle=p.color;
ctx.beginPath();
ctx.arc(p.x,p.y,3,0,Math.PI*2);
ctx.fill();
if(p.life<=0) particles.splice(i,1);
});
ctx.globalAlpha=1;
requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
